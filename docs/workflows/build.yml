name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils gcc ffmpeg
      - name: Build static assembly lamp-cli
        run: ./build.sh
      - name: Verify every portable suite
        run: python3 tests/run.py --skip-playback
      - name: Cross-build Windows binaries with LLVM
        run: python3 tools/build-windows.py
      - name: Check Windows architecture, resources and runtime dependencies
        run: node tests/verify-runtime.js
  windows-x64:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Build assembly players with LLVM
        run: ./build.ps1 -Tests
      - name: Check architecture, resources and runtime dependencies
        run: node tests/verify-runtime.js
      - name: Check advertised audio formats including Opus
        run: node tests/smoke.js
      - name: Verify table provenance, Opus stages and Ogg CRC with Visual C++ oracles
        run: python tests/run.py --quick
      - name: Check static site
        run: node tests/verify-site.js
      - name: Render actual assembly UI
        run: ./tests/render-ui.ps1
      - name: Package source and binaries
        run: ./package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: lamp-windows-x64
          path: ../outputs/lamp-windows-x64-*.zip
          if-no-files-found: error
          retention-days: 14
